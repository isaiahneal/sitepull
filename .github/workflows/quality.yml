name: Quality

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: true
          install: false

      - name: Validate release installers
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          sh -n scripts/sitepull-install.sh
          shellcheck scripts/sitepull-install.sh
          HOME=/tmp \
            SITEPULL_INSTALLER_TEST_MODE=1 \
            SITEPULL_INSTALLER_TEST_OS=Darwin \
            SITEPULL_INSTALLER_TEST_ARCH=arm64 \
            SITEPULL_INSTALLER_TEST_MACOS_VERSION=15.0 \
            sh scripts/sitepull-install.sh --dry-run --version "${package_version}"
          if sh scripts/sitepull-install.sh --dry-run --version invalid; then
            echo 'POSIX installer accepted an invalid release version' >&2
            exit 1
          fi

          pwsh -NoLogo -NoProfile -File scripts/sitepull-install.ps1 \
            -Version "v${package_version}" -DryRun
          if pwsh -NoLogo -NoProfile -File scripts/sitepull-install.ps1 \
            -Version invalid -DryRun; then
            echo 'PowerShell installer accepted an invalid release version' >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build CLI
        run: pnpm build:cli
