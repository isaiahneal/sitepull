name: Desktop distributions

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-distributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  release-metadata:
    name: Release metadata gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify tag, package version, and release notes agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi

          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "${notes_file}" ]]; then
            echo "Required release notes are missing or empty: ${notes_file}" >&2
            exit 1
          fi

  make:
    name: ${{ matrix.name }}
    needs: [quality, release-metadata]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            command: make:mac
            artifact: sitepull-macos
          - name: Linux
            os: ubuntu-24.04
            command: make:linux
            artifact: sitepull-linux
          - name: Windows
            os: windows-2022
            command: make:windows
            artifact: sitepull-windows

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: true
          install: false

      - name: Install Linux maker prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux WebKit system dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps webkit

      - name: Build native distributions
        run: pnpm run ${{ matrix.command }}

      - name: Smoke-test packaged application
        if: runner.os != 'Linux'
        run: pnpm --filter @sitepull/desktop smoke:packaged

      - name: Install and smoke-test the Ubuntu DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find apps/desktop/out/make -type f -name '*.deb' -print -quit)"
          test -f "$deb"
          deb="$(realpath "$deb")"
          sudo apt-get install --yes "$deb"
          test "$(stat --format='%u:%g:%a' /usr/lib/sitepull/chrome-sandbox)" = "0:0:4755"
          SITEPULL_PACKAGE_DIRECTORY=/usr/lib/sitepull \
            pnpm --filter @sitepull/desktop smoke:packaged

      - name: Clean-install and audit the Ubuntu 24.04 DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}/apps/desktop/out/make:/artifacts:ro" \
            ubuntu:24.04@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              deb="$(find /artifacts -type f -name "*.deb" -print -quit)"
              test -n "${deb}"
              apt-get install --yes "${deb}"
              apt-get check
              test "$(dpkg-query --show --showformat="\${db:Status-Abbrev}" sitepull)" = "ii "
              executable="$(readlink -f "$(command -v sitepull)")"
              test "${executable}" = "/usr/lib/sitepull/Sitepull"
              test -x "${executable}"
              sandbox="$(dirname "${executable}")/chrome-sandbox"
              test "$(stat --format="%u:%g:%a" "${sandbox}")" = "0:0:4755"
              browser_root="/usr/lib/sitepull/resources/.playwright-browsers"
              mapfile -d "" -t webkit_launchers < <(
                find "${browser_root}" -mindepth 2 -maxdepth 2 \
                  -type f -name pw_run.sh -print0
              )
              test "${#webkit_launchers[@]}" -eq 1
              test -x "${webkit_launchers[0]}"

              electron_dependencies="$(ldd "${executable}")"
              printf "%s\n" "${electron_dependencies}"
              if grep -Fq "not found" <<< "${electron_dependencies}"; then
                exit 1
              fi

              audit_webkit_flavor() {
                local flavor_root="$1"
                shift
                local dependencies relative target
                test -x "${flavor_root}/MiniBrowser"
                for relative in "$@"; do
                  target="${flavor_root}/${relative}"
                  test -x "${target}"
                  if ! dependencies="$(
                    LD_LIBRARY_PATH="${flavor_root}/lib:${flavor_root}/sys/lib" \
                      ldd "${target}" 2>&1
                  )"; then
                    printf "ldd failed for %s\n%s\n" "${target}" "${dependencies}" >&2
                    return 1
                  fi
                  if [[ "${dependencies}" == *"not found"* ]]; then
                    printf "Unresolved dependency for %s\n%s\n" \
                      "${target}" "${dependencies}" >&2
                    return 1
                  fi
                done
              }

              webkit_root="$(dirname "${webkit_launchers[0]}")"
              audit_webkit_flavor "${webkit_root}/minibrowser-gtk" \
                bin/MiniBrowser bin/WebKitWebProcess bin/WebKitGPUProcess \
                bin/WebKitNetworkProcess lib/libwebkitgtkinjectedbundle.so
              audit_webkit_flavor "${webkit_root}/minibrowser-wpe" \
                bin/MiniBrowser bin/WPEWebProcess bin/WPEGPUProcess \
                bin/WPENetworkProcess lib/libWPEInjectedBundle.so
              echo "Audited the packaged GTK and WPE WebKit dependency closures."
            '

      - name: Upload native artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}-${{ runner.arch }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, release-metadata, make]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sitepull-*
          path: native-artifacts

      - name: Stage release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' source; do
            filename="$(basename "$source")"
            case "$filename" in
              *.dmg|*.zip|*.deb|*Setup.exe|*.nupkg)
                destination="release-assets/$filename"
                ;;
              RELEASES)
                destination="release-assets/Sitepull-windows-RELEASES"
                ;;
              *)
                continue
                ;;
            esac
            if [[ -e "$destination" ]]; then
              echo "Duplicate release asset: $filename" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done < <(find native-artifacts -type f -print0)

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$asset_count" -lt 7 ]]; then
            echo "Expected at least 7 native release assets, found $asset_count" >&2
            find native-artifacts -type f -print
            exit 1
          fi

          checksum_manifest="${RUNNER_TEMP}/SHA256SUMS.txt"
          (
            cd release-assets
            find . -maxdepth 1 -type f -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > "$checksum_manifest"
          )
          mv "$checksum_manifest" release-assets/SHA256SUMS.txt

      - name: Verify staged release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets

          expected_manifest="${RUNNER_TEMP}/SHA256SUMS.expected"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > "$expected_manifest"

          if ! cmp --silent SHA256SUMS.txt "$expected_manifest"; then
            echo "Checksum manifest does not cover the exact staged release asset set" >&2
            diff -u SHA256SUMS.txt "$expected_manifest" || true
            exit 1
          fi

          sha256sum --check --strict SHA256SUMS.txt

      - name: Attest native release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: release-assets/SHA256SUMS.txt

      - name: Attest checksum manifest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-assets/SHA256SUMS.txt

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "Sitepull $GITHUB_REF_NAME" \
            --notes-file "$notes_file"
