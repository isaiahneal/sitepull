name: Native distributions

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: native-distributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  release-metadata:
    name: Release metadata gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify tag, package version, and release notes agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi

          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "${notes_file}" ]]; then
            echo "Required release notes are missing or empty: ${notes_file}" >&2
            exit 1
          fi

  make:
    name: ${{ matrix.name }}
    needs: [quality, release-metadata]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 (Apple silicon)
            os: macos-15
            command: make:mac
            artifact: sitepull-macos-arm64
            expected_arch: arm64
            linux_target: ''
          - name: macOS 15 (Intel)
            os: macos-15-intel
            command: make:mac
            artifact: sitepull-macos-x64
            expected_arch: x64
            linux_target: ''
          - name: Ubuntu 24.04 (x64)
            os: ubuntu-24.04
            command: make:linux:ubuntu24
            artifact: sitepull-ubuntu24.04-x64
            expected_arch: x64
            linux_target: ubuntu24.04
          - name: Windows (x64)
            os: windows-2022
            command: make:windows
            artifact: sitepull-windows-x64
            expected_arch: x64
            linux_target: ''

    env:
      SITEPULL_LINUX_TARGET: ${{ matrix.linux_target }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm and Node.js
        if: matrix.os != 'macos-15-intel'
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: true
          install: false

      # pnpm 11's standalone executable cannot start on Intel macOS because of
      # an upstream Node.js SEA bug. Install the same pinned pnpm package on a
      # separately provisioned x64 Node runtime instead.
      - name: Install Node.js on Intel macOS
        if: matrix.os == 'macos-15-intel'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0

      - name: Install pnpm on Intel macOS
        if: matrix.os == 'macos-15-intel'
        run: npm install --global pnpm@11.24.0

      - name: Install Linux maker prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot xvfb

      - name: Verify native runner architecture
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.expected_arch }}
        run: >-
          node --eval "if (process.arch !== process.env.EXPECTED_NODE_ARCH)
          throw new Error('Expected ' + process.env.EXPECTED_NODE_ARCH + ', received ' + process.arch)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux WebKit system dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps webkit

      - name: Build native distributions
        run: pnpm run ${{ matrix.command }}

      - name: Smoke-test packaged application
        if: runner.os != 'Linux'
        run: pnpm --filter @sitepull/desktop smoke:packaged

      - name: Install and smoke-test the Ubuntu DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find apps/desktop/out/make -type f -name '*.deb' -print -quit)"
          test -f "$deb"
          deb="$(realpath "$deb")"
          sudo apt-get install --yes "$deb"
          test "$(stat --format='%u:%g:%a' /usr/lib/sitepull/chrome-sandbox)" = "0:0:4755"
          SITEPULL_PACKAGE_DIRECTORY=/usr/lib/sitepull \
            pnpm --filter @sitepull/desktop smoke:packaged

      - name: Clean-install and audit the Ubuntu 24.04 DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          docker run --rm \
            --volume "${PWD}/apps/desktop/out/make:/artifacts:ro" \
            --volume "${PWD}/scripts/audit-installed-linux-package.sh:/audit-installed-linux-package.sh:ro" \
            --env "SITEPULL_EXPECTED_DEB_VERSION=${package_version}-1~ubuntu24.04" \
            ubuntu:24.04@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              deb="$(find /artifacts -type f -name "*.deb" -print -quit)"
              test -n "${deb}"
              apt-get install --yes "${deb}"
              apt-get check
              /audit-installed-linux-package.sh
            '

      - name: Upload native artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  make-debian:
    name: ${{ matrix.name }} build
    needs: [quality, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (x64)
            target: debian12
            command: make:linux:debian12
            artifact: sitepull-debian12-x64
            image: node:24.20.0-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
          - name: Debian 13 (x64)
            target: debian13
            command: make:linux:debian13
            artifact: sitepull-debian13-x64
            image: node:24.20.0-trixie@sha256:f7d34e58713740f9eef9092c0bd6ff10369d132f7238399a4b270f16d47fa608
    container:
      image: ${{ matrix.image }}
    env:
      SITEPULL_LINUX_TARGET: ${{ matrix.target }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: true
          install: false

      - name: Verify native x64 builder
        run: >-
          node --eval "if (process.arch !== 'x64')
          throw new Error('Expected x64, received ' + process.arch)"

      - name: Install DEB maker prerequisites
        shell: bash
        run: |
          apt-get update
          apt-get install --yes fakeroot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build distribution-matched DEB
        run: pnpm run ${{ matrix.command }}

      - name: Verify DEB identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          expected_version="${package_version}-1~${SITEPULL_LINUX_TARGET}"
          expected_name="sitepull_${expected_version}_amd64.deb"
          deb="$(find apps/desktop/out/make -type f -name '*.deb' -print -quit)"
          test "$(basename "${deb}")" = "${expected_name}"
          test "$(dpkg-deb --field "${deb}" Package)" = "sitepull"
          test "$(dpkg-deb --field "${deb}" Version)" = "${expected_version}"
          test "$(dpkg-deb --field "${deb}" Architecture)" = "amd64"

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/out/make/**/*.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  audit-debian:
    name: ${{ matrix.name }} clean install
    needs: [make-debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (x64)
            target: debian12
            artifact: sitepull-debian12-x64
            image: node:24.20.0-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
          - name: Debian 13 (x64)
            target: debian13
            artifact: sitepull-debian13-x64
            image: node:24.20.0-trixie@sha256:f7d34e58713740f9eef9092c0bd6ff10369d132f7238399a4b270f16d47fa608
    container:
      image: ${{ matrix.image }}
      # The disposable audit container must permit Electron to create its own
      # namespaces. Sitepull's setuid sandbox and hardened fuses stay enabled.
      options: --security-opt seccomp=unconfined
    env:
      SITEPULL_LINUX_TARGET: ${{ matrix.target }}

    steps:
      - name: Check out smoke tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: true
          install: false

      - name: Install smoke-test dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/out/make/${{ matrix.target }}

      - name: Clean-install and audit DEB
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          export SITEPULL_EXPECTED_DEB_VERSION="${package_version}-1~${SITEPULL_LINUX_TARGET}"
          apt-get update
          deb="$(find apps/desktop/out/make -type f -name '*.deb' -print -quit)"
          deb="$(realpath "${deb}")"
          apt-get install --yes "${deb}" xvfb
          apt-get check
          scripts/audit-installed-linux-package.sh

      - name: Smoke-test installed application as an unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash sitepull-smoke
          install -d -m 700 -o sitepull-smoke -g sitepull-smoke /tmp/sitepull-smoke-runtime
          runuser --user sitepull-smoke -- env \
            HOME=/home/sitepull-smoke \
            XDG_RUNTIME_DIR=/tmp/sitepull-smoke-runtime \
            SITEPULL_LINUX_TARGET="${SITEPULL_LINUX_TARGET}" \
            SITEPULL_PACKAGE_DIRECTORY=/usr/lib/sitepull \
            node apps/desktop/scripts/smoke-packaged-app.mjs

  make-fedora:
    name: Fedora 44 CLI RPM (x64)
    needs: [quality, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FEDORA_IMAGE: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify native x64 builder
        shell: bash
        run: test "$(uname -m)" = x86_64

      - name: Install pinned Node.js and pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: true
          install: false

      - name: Build audited native-binary-free CLI payload
        shell: bash
        run: packaging/fedora/build-payload.sh "${RUNNER_TEMP}/sitepull-fedora-payload"

      - name: Build Fedora 44 RPM
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct)"
          mkdir -p dist/fedora
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --volume "${RUNNER_TEMP}/sitepull-fedora-payload:/payload:ro" \
            --volume "${GITHUB_WORKSPACE}/dist/fedora:/output" \
            --env SITEPULL_PAYLOAD_ROOT=/payload \
            --env "SITEPULL_SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --env "SITEPULL_OUTPUT_UID=$(id -u)" \
            --env "SITEPULL_OUTPUT_GID=$(id -g)" \
            "${FEDORA_IMAGE}" \
            bash /workspace/packaging/fedora/build-rpm.sh

      - name: Clean-install and smoke-test Fedora RPM
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          rpm_name="sitepull-cli-${package_version}-1.fc44.x86_64.rpm"
          test -s "dist/fedora/${rpm_name}"
          docker run --rm \
            --init \
            --platform linux/amd64 \
            --security-opt seccomp=unconfined \
            --shm-size=1g \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --volume "${GITHUB_WORKSPACE}/dist/fedora/${rpm_name}:/package/sitepull-cli.rpm:ro" \
            "${FEDORA_IMAGE}" \
            bash /workspace/packaging/fedora/smoke-installed.sh /package/sitepull-cli.rpm

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sitepull-fedora44-x64
          path: dist/fedora/*.rpm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  make-alpine:
    name: Alpine 3.24 CLI APK (x64)
    needs: [quality, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ALPINE_IMAGE: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify native x64 builder
        shell: bash
        run: test "$(uname -m)" = x86_64

      - name: Build signed Alpine 3.24 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/alpine
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --volume "${GITHUB_WORKSPACE}/dist/alpine:/output" \
            --env SITEPULL_SOURCE_ROOT=/workspace \
            "${ALPINE_IMAGE}" \
            sh /workspace/packaging/alpine/build-apk.sh /output

      - name: Clean-install and audit signed Alpine APK
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          apk_name="sitepull-cli-${package_version}-r0.apk"
          key_name="sitepull-alpine-v${package_version}.rsa.pub"
          test -s "dist/alpine/${apk_name}"
          test -s "dist/alpine/${key_name}"
          docker run --rm \
            --init \
            --platform linux/amd64 \
            --security-opt seccomp=unconfined \
            --shm-size=1g \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --volume "${GITHUB_WORKSPACE}/dist/alpine:/artifacts:ro" \
            --workdir /workspace \
            --env "SITEPULL_VERSION=${package_version}" \
            "${ALPINE_IMAGE}" \
            sh -eux -c '
              packaging/alpine/audit-apk.sh \
                "/artifacts/sitepull-cli-${SITEPULL_VERSION}-r0.apk" \
                "/artifacts/sitepull-alpine-v${SITEPULL_VERSION}.rsa.pub" \
                "${SITEPULL_VERSION}"
            '

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sitepull-alpine3.24-x64
          path: |
            dist/alpine/*.apk
            dist/alpine/*.rsa.pub
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, release-metadata, make, make-debian, audit-debian, make-fedora, make-alpine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: false
          install: false

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sitepull-*
          path: native-artifacts

      - name: Stage release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          mkdir -p release-assets
          while IFS= read -r -d '' source; do
            filename="$(basename "$source")"
            published_name="$(node scripts/release-assets.ts published-name "$filename")"
            if [[ -z "$published_name" ]]; then
              continue
            fi
            destination="release-assets/$published_name"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release asset: $published_name" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done < <(find native-artifacts -type f -print0)

          node scripts/release-assets.ts verify "${package_version}" release-assets

          checksum_manifest="${RUNNER_TEMP}/SHA256SUMS.txt"
          (
            cd release-assets
            find . -maxdepth 1 -type f -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > "$checksum_manifest"
          )
          mv "$checksum_manifest" release-assets/SHA256SUMS.txt

      - name: Verify staged release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets

          expected_manifest="${RUNNER_TEMP}/SHA256SUMS.expected"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > "$expected_manifest"

          if ! cmp --silent SHA256SUMS.txt "$expected_manifest"; then
            echo "Checksum manifest does not cover the exact staged release asset set" >&2
            diff -u SHA256SUMS.txt "$expected_manifest" || true
            exit 1
          fi

          sha256sum --check --strict SHA256SUMS.txt

      - name: Attest native release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: release-assets/SHA256SUMS.txt

      - name: Attest checksum manifest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-assets/SHA256SUMS.txt

      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --draft \
            --title "Sitepull $GITHUB_REF_NAME" \
            --notes-file "$notes_file"

      - name: Verify uploaded release names and digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          expected_names="${RUNNER_TEMP}/release-assets.expected"
          actual_names="${RUNNER_TEMP}/release-assets.actual"
          remote_assets="${RUNNER_TEMP}/release-assets.remote.tsv"

          {
            node scripts/release-assets.ts print "${package_version}"
            printf '%s\n' SHA256SUMS.txt
          } | LC_ALL=C sort > "${expected_names}"
          gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '.assets[].name' | LC_ALL=C sort > "${actual_names}"

          if ! cmp --silent "${expected_names}" "${actual_names}"; then
            echo "GitHub stored a different release asset set" >&2
            diff -u "${expected_names}" "${actual_names}" || true
            exit 1
          fi

          gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv' > "${remote_assets}"
          while IFS=$'\t' read -r filename remote_digest; do
            local_digest="sha256:$(sha256sum "release-assets/${filename}" | cut -d ' ' -f1)"
            if [[ "${remote_digest}" != "${local_digest}" ]]; then
              echo "GitHub digest mismatch for ${filename}: ${remote_digest}" >&2
              exit 1
            fi
          done < "${remote_assets}"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
