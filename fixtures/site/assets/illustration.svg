<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title description">
  <title id="title">Abstract browser extraction diagram</title>
  <desc id="description">Layered browser windows, color swatches, and connecting paths.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#315bea" />
      <stop offset="1" stop-color="#7455c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#1d2433" flood-opacity=".2" />
    </filter>
  </defs>
  <rect width="640" height="640" rx="56" fill="#f5f1e8" />
  <circle cx="510" cy="120" r="72" fill="#e26a4f" opacity=".88" />
  <path d="M65 500C180 390 220 555 355 430s170-72 220-190" fill="none" stroke="#4e7456" stroke-width="18" stroke-linecap="round" opacity=".65" />
  <g filter="url(#shadow)">
    <rect x="92" y="128" width="420" height="310" rx="28" fill="#fffdf8" stroke="#1d2433" stroke-width="4" />
    <path d="M92 188h420" stroke="#1d2433" stroke-width="4" />
    <circle cx="130" cy="158" r="9" fill="#e26a4f" />
    <circle cx="160" cy="158" r="9" fill="#b77618" />
    <circle cx="190" cy="158" r="9" fill="#4e7456" />
    <rect x="132" y="230" width="155" height="32" rx="16" fill="#1d2433" />
    <rect x="132" y="282" width="286" height="16" rx="8" fill="#667085" opacity=".54" />
    <rect x="132" y="316" width="235" height="16" rx="8" fill="#667085" opacity=".3" />
    <rect x="132" y="362" width="92" height="42" rx="21" fill="url(#background)" />
  </g>
  <g transform="translate(400 370) rotate(7)">
    <rect width="164" height="170" rx="24" fill="#fffdf8" stroke="#1d2433" stroke-width="4" />
    <rect x="26" y="26" width="112" height="72" rx="14" fill="url(#background)" />
    <rect x="26" y="120" width="78" height="12" rx="6" fill="#1d2433" />
    <rect x="26" y="144" width="112" height="8" rx="4" fill="#667085" opacity=".42" />
  </g>
</svg>
